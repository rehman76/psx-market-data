
name: PSX closing data pipeline

on:
  schedule:
    # 16:00, 16:10, 16:30 PKT for closing-file retries; 08:50 PKT for premarket.
    # GitHub schedule triggers can be delayed and do not guarantee publication before 16:15.
    - cron: '0,10,30 11 * * 1-5'
    - cron: '50 3 * * 1-5'

  workflow_dispatch:
    inputs:
      download_url:
        description: 'Optional: VERIFIED and authorized direct PSX closing file HTTPS URL'
        required: false
        type: string
      bootstrap_sample:
        description: 'One-time seed using the uploaded October 12 sample (only if permitted)'
        required: false
        default: false
        type: boolean
      publish_pages:
        description: 'Publish to public GitHub Pages ONLY if PSX data redistribution is authorized'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: psx-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      can_publish: ${{ steps.flags.outputs.can_publish }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Restore persistent state branch if it exists
        shell: bash
        run: |
          mkdir -p state closing_files
          if git ls-remote --exit-code --heads origin psx-state >/dev/null 2>&1; then
            git fetch --depth=1 origin psx-state
            git show FETCH_HEAD:psx_ohlcv.sqlite > state/psx_ohlcv.sqlite || true
            git show FETCH_HEAD:recommendation_register.json > state/recommendation_register.json 2>/dev/null || rm -f state/recommendation_register.json
          fi

      - name: Optional one-time bootstrap from sample
        if: inputs.bootstrap_sample == true
        run: cp sample/20261012_new.lis.Z closing_files/20261012_new.lis.Z

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install psxdata dependency when authorized
        if: vars.PSXDATA_AUTOMATED_USE_AUTHORIZED == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Try dated PSX download (only when authorized)
        if: vars.PSX_AUTOMATED_DOWNLOAD_AUTHORIZED == 'true'
        continue-on-error: true
        run: python scripts/fetch_closing.py --directory closing_files --authorized

      - name: Test official-download diagnostics
        id: official_diagnostics_tests
        continue-on-error: true
        run: |
          python -m unittest discover -s tests -p 'test_official_download_diagnostics.py' -v
          python -m unittest discover -s tests -p 'test_official_url_template.py' -v

      - name: Import, calculate and export
        env:
          AUTHORIZED_CLOSING_URL: ${{ inputs.download_url || vars.PSX_AUTHORIZED_CLOSING_URL }}
          PSXDATA_AUTOMATED_USE_AUTHORIZED: ${{ vars.PSXDATA_AUTOMATED_USE_AUTHORIZED }}
        shell: bash
        run: |
          PSXDATA_ARGS=()
          if [ "${PSXDATA_AUTOMATED_USE_AUTHORIZED:-}" = 'true' ]; then
            PSXDATA_ARGS=(
              --psxdata
              --psxdata-mode backfill
              --psxdata-backfill-days 430
              --psxdata-min-sessions 250
            )
          else
            echo 'psxdata collection disabled; set PSXDATA_AUTOMATED_USE_AUTHORIZED=true only after verifying automated-use permission.'
          fi

          python scripts/run_pipeline.py \
            --input closing_files \
            --db state/psx_ohlcv.sqlite \
            --publish publish \
            --symbols MCB SYS KOHE \
            "${PSXDATA_ARGS[@]}"

      - name: Test official source health summary
        id: official_health_tests
        continue-on-error: true
        run: |
          python -m unittest discover -s tests -p 'test_official_source_summary.py' -v

      - name: Summarize official source health
        id: official_health_summary
        continue-on-error: true
        if: steps.official_health_tests.outcome == 'success'
        run: |
          python scripts/official_source_summary.py \
            --status publish/status.json \
            --out publish/official_source_health.md
          cat publish/official_source_health.md >> "$GITHUB_STEP_SUMMARY"

      - name: Build optional research discovery watchlist
        # Isolated from portfolio feed; failure must not corrupt existing reporting.
        continue-on-error: true
        env:
          PSXDATA_AUTOMATED_USE_AUTHORIZED: ${{ vars.PSXDATA_AUTOMATED_USE_AUTHORIZED }}
        shell: bash
        run: |
          DISCOVERY_ARGS=()
          if [ "${PSXDATA_AUTOMATED_USE_AUTHORIZED:-}" = 'true' ]; then
            DISCOVERY_ARGS=(--collect-authorized)
          fi
          python scripts/discover_candidates.py \
            --db state/psx_ohlcv.sqlite \
            --config config/discovery_universe.json \
            --out publish/discovery_watchlist.json \
            "${DISCOVERY_ARGS[@]}"

      - name: Test gated technical research validation
        id: research_tests
        continue-on-error: true
        run: |
          python -m unittest discover -s tests -p 'test_research_validation.py' -v
          python scripts/research_validation.py --help > /dev/null

      - name: Build gated technical research validation
        id: research
        # Isolated research diagnostics; failures must be surfaced after artifact upload.
        continue-on-error: true
        if: steps.research_tests.outcome == 'success'
        run: |
          python scripts/research_validation.py \
            --db state/psx_ohlcv.sqlite \
            --discovery publish/discovery_watchlist.json \
            --out publish/research_validation.json

      - name: Verify research validation output exists
        id: research_artifact
        continue-on-error: true
        run: |
          test -s publish/research_validation.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('publish/research_validation.json').read_text())
          assert p.get('health', {}).get('symbols') == len(p.get('reviews', []))
          assert all(not r.get('trade_eligible', False) for r in p['reviews'])
          PY

      - name: Test authorized DPS closing-file adapter
        id: dps_evidence_tests
        continue-on-error: true
        run: |
          python -m unittest discover -s tests -p 'test_dps_closing_evidence.py' -v
          python scripts/dps_closing_evidence.py --help > /dev/null

      - name: Extract evidence from explicitly authorized official download
        id: dps_evidence_capture
        continue-on-error: true
        if: vars.PSX_DPS_EVIDENCE_CAPTURE_AUTHORIZED == 'true'
        env:
          AUTHORIZED_CLOSING_URL: ${{ inputs.download_url || vars.PSX_AUTHORIZED_CLOSING_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AUTHORIZED_CLOSING_URL:-}"
          # Only run_pipeline.py creates these names after an explicit authorized download.
          mapfile -t FILES < <(find closing_files -maxdepth 1 -name 'authorized_*.lis.Z' -type f -print)
          test "${#FILES[@]}" -eq 1
          RESOLVED_CLOSING_URL="$(python - <<'PY'
          import os
          from scripts.official_url_template import resolve_download_url
          print(resolve_download_url(os.environ['AUTHORIZED_CLOSING_URL'])[0])
          PY
          )"
          python scripts/dps_closing_evidence.py \
            --file "${FILES[0]}" \
            --source-url "${RESOLVED_CLOSING_URL}" \
            --discovery publish/discovery_watchlist.json \
            --out "${RUNNER_TEMP}/dps_evidence.json" \
            --manifest publish/dps_evidence_manifest.json

      - name: Test source evidence auditor
        id: source_tests
        continue-on-error: true
        run: |
          python -m unittest discover -s tests -p 'test_source_verification.py' -v
          python scripts/source_verification.py --help > /dev/null

      - name: Build source evidence audit
        id: source_audit
        continue-on-error: true
        if: steps.source_tests.outcome == 'success'
        run: |
          # No submitted evidence yet: emit explicit NO_INDEPENDENT_EVIDENCE,
          # rather than treating existing provider records as independent DPS.
          SOURCE_ARGS=()
          if [ "${{ steps.dps_evidence_capture.outcome }}" = 'success' ] && \
             [ -s "${RUNNER_TEMP}/dps_evidence.json" ]; then
            SOURCE_ARGS=(--evidence "${RUNNER_TEMP}/dps_evidence.json")
          fi
          python scripts/source_verification.py \
            --db state/psx_ohlcv.sqlite \
            --discovery publish/discovery_watchlist.json \
            --out publish/source_verification.json \
            "${SOURCE_ARGS[@]}"

      - name: Validate source evidence report
        id: source_artifact
        continue-on-error: true
        run: |
          test -s publish/source_verification.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('publish/source_verification.json').read_text())
          assert r['health']['symbols']==len(r['reviews'])
          assert r['health']['trade_eligible']==0
          assert not r['official_psx_dps_verification_complete']
          assert all(not x['independently_verified'] for x in r['reviews'])
          PY

      - name: Test fundamental disclosure review
        id: fundamentals_tests
        continue-on-error: true
        run: |
          python -m unittest discover -s tests -p 'test_fundamental_review.py' -v
          python scripts/fundamental_review.py --help > /dev/null

      - name: Generate fundamental disclosure review
        id: fundamentals
        continue-on-error: true
        if: steps.fundamentals_tests.outcome == 'success'
        run: |
          # No disclosure input is silently assumed: by default all symbols are pending.
          python scripts/fundamental_review.py \
            --discovery publish/discovery_watchlist.json \
            --out publish/fundamental_review.json

      - name: Validate fundamental review artifact
        id: fundamentals_artifact
        continue-on-error: true
        run: |
          test -s publish/fundamental_review.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('publish/fundamental_review.json').read_text())
          assert r['health']['symbols']==len(r['reviews'])
          assert r['health']['trade_eligible']==0
          assert r['health']['fundamentally_verified']==0
          assert all(not x['fundamentals_verified'] and not x['trade_eligible'] for x in r['reviews'])
          PY

      - name: Test financial document integrity
        id: document_integrity_tests
        continue-on-error: true
        run: |
          python -m unittest discover -s tests -p 'test_financial_document_integrity.py' -v
          python scripts/financial_document_integrity.py --help > /dev/null

      - name: Generate financial document integrity report
        id: document_integrity
        continue-on-error: true
        if: steps.document_integrity_tests.outcome == 'success' && steps.fundamentals.outcome == 'success' && steps.fundamentals_artifact.outcome == 'success'
        run: |
          # No local issuer reports provided by default; declare this explicitly.
          python scripts/financial_document_integrity.py \
            --fundamentals publish/fundamental_review.json \
            --out publish/financial_document_integrity.json

      - name: Verify financial document integrity report
        id: document_integrity_artifact
        continue-on-error: true
        if: steps.document_integrity.outcome == 'success'
        run: |
          test -s publish/financial_document_integrity.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('publish/financial_document_integrity.json').read_text())
          assert r['health']['symbols']==len(r['reviews'])
          assert r['health']['trade_eligible']==0
          assert r['health']['issuer_authenticated']==0
          assert all(not x['trade_eligible'] and not x['issuer_authenticity_verified'] for x in r['reviews'])
          PY

      - name: Test research coordinator
        run: python -m unittest discover -s tests -p 'test_research_coordinator.py' -v

      - name: Build research agenda and persistent watch register
        run: |
          EXTRA=()
          if [ -s state/recommendation_register.json ]; then
            EXTRA=(--previous state/recommendation_register.json)
          fi
          python scripts/research_coordinator.py "${EXTRA[@]}" \
            --agenda-out publish/research_agenda.json \
            --register-out publish/recommendation_register.json

      - name: Check source freshness
        id: freshness
        continue-on-error: true
        run: |
          python scripts/check_freshness.py \
            --publish publish \
            --db state/psx_ohlcv.sqlite \
            --symbols MCB SYS KOHE \
            --min-sessions 250 \
            --max-business-lag 1

      - name: Prevent stale feed publication
        if: steps.freshness.outcome != 'success'
        run: |
          echo 'WARNING: market data is stale or insufficient; latest feed must not be treated as current.'
          # Fail after uploading diagnostic artifacts; persistence still runs.

      - name: Upload feed as workflow artifact (private to repository permissions)
        uses: actions/upload-artifact@v4
        with:
          name: psx-analysis-feed
          path: |
            publish/discovery_watchlist.json
            publish/research_agenda.json
            publish/recommendation_register.json
            publish/research_validation.json
            publish/source_verification.json
            publish/official_source_health.md
            publish/fundamental_review.json
            publish/financial_document_integrity.json
            publish/dps_evidence_manifest.json
            publish/psx_analysis_feed.json
            publish/status.json
            publish/psxdata_status.json
            publish/freshness.json
          retention-days: 30

      - name: Persist SQLite on psx-state branch
        shell: bash
        run: |
          cp state/psx_ohlcv.sqlite "$RUNNER_TEMP/psx_ohlcv.sqlite"
          cp publish/recommendation_register.json "$RUNNER_TEMP/recommendation_register.json"

          git fetch origin psx-state:refs/remotes/origin/psx-state 2>/dev/null || true
          # Refuse to overwrite a remote DB that gained a newer session while this job ran.
          if git show-ref --verify --quiet refs/remotes/origin/psx-state; then
            git show refs/remotes/origin/psx-state:psx_ohlcv.sqlite > "$RUNNER_TEMP/remote_state.sqlite" || true
            if [ -s "$RUNNER_TEMP/remote_state.sqlite" ]; then
              python - "$RUNNER_TEMP/remote_state.sqlite" "$RUNNER_TEMP/psx_ohlcv.sqlite" <<'PYCODE'
          import sqlite3, sys
          with sqlite3.connect(sys.argv[1]) as remote, sqlite3.connect(sys.argv[2]) as local:
              for symbol in ('MCB','SYS','KOHE'):
                  query = 'SELECT MAX(trade_date) FROM ohlcv WHERE symbol=?'
                  remote_latest = remote.execute(query,(symbol,)).fetchone()[0] or ''
                  local_latest = local.execute(query,(symbol,)).fetchone()[0] or ''
                  if remote_latest > local_latest:
                      raise SystemExit(f'Remote state is newer for {symbol}: {remote_latest} > {local_latest}')
          PYCODE
            fi
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if git show-ref --verify --quiet refs/remotes/origin/psx-state; then
            git worktree add --detach "$RUNNER_TEMP/psx-state" refs/remotes/origin/psx-state
          else
            git worktree add --detach "$RUNNER_TEMP/psx-state"
            (
              cd "$RUNNER_TEMP/psx-state"
              git checkout --orphan psx-state
              git rm -rf . >/dev/null 2>&1 || true
            )
          fi

          cp "$RUNNER_TEMP/psx_ohlcv.sqlite" "$RUNNER_TEMP/psx-state/psx_ohlcv.sqlite"
          cp "$RUNNER_TEMP/recommendation_register.json" "$RUNNER_TEMP/psx-state/recommendation_register.json"

          (
            cd "$RUNNER_TEMP/psx-state"
            git add psx_ohlcv.sqlite recommendation_register.json

            if ! git diff --cached --quiet; then
              git commit -m 'Update PSX OHLCV state'
            fi

            git push origin HEAD:psx-state
          )

      - name: Decide public publishing
        id: flags
        env:
          INPUT_PUBLISH: ${{ inputs.publish_pages }}
          ALLOW_PUBLIC: ${{ vars.PSX_ALLOW_PUBLIC_PUBLISH }}
        run: |
          if [ "$INPUT_PUBLISH" = 'true' ] && \
             [ "$ALLOW_PUBLIC" = 'true' ] && \
             [ '${{ steps.freshness.outcome }}' = 'success' ] && \
             [ '${{ steps.official_diagnostics_tests.outcome }}' = 'success' ] && \
             [ '${{ steps.official_health_tests.outcome }}' = 'success' ] && \
             [ '${{ steps.official_health_summary.outcome }}' = 'success' ] && \
             [ '${{ steps.research_tests.outcome }}' = 'success' ] && \
             [ '${{ steps.research.outcome }}' = 'success' ] && \
             [ '${{ steps.research_artifact.outcome }}' = 'success' ] && \
             [ '${{ steps.source_tests.outcome }}' = 'success' ] && \
             [ '${{ steps.source_audit.outcome }}' = 'success' ] && \
             [ '${{ steps.source_artifact.outcome }}' = 'success' ] && \
             [ '${{ steps.dps_evidence_tests.outcome }}' = 'success' ] && \
             [ '${{ steps.fundamentals_tests.outcome }}' = 'success' ] && \
             [ '${{ steps.fundamentals.outcome }}' = 'success' ] && \
             [ '${{ steps.fundamentals_artifact.outcome }}' = 'success' ] && \
             [ '${{ steps.document_integrity_tests.outcome }}' = 'success' ] && \
             [ '${{ steps.document_integrity.outcome }}' = 'success' ] && \
             [ '${{ steps.document_integrity_artifact.outcome }}' = 'success' ] && \
             [ '${{ vars.PSX_DPS_EVIDENCE_CAPTURE_AUTHORIZED }}' != 'true' ]; then
            echo 'can_publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'can_publish=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Pages artifact (only when authorized and enabled)
        if: steps.flags.outputs.can_publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish

      - name: Mark missing research validation as workflow failure
        if: steps.research_tests.outcome != 'success' || steps.research.outcome != 'success' || steps.research_artifact.outcome != 'success'
        run: |
          echo 'ERROR: technical research validation failed or artifact absent; see earlier steps.'
          exit 1

      - name: Mark source audit failures as workflow failure
        if: steps.source_tests.outcome != 'success' || steps.source_audit.outcome != 'success' || steps.source_artifact.outcome != 'success'
        run: |
          echo 'ERROR: PSX evidence audit tests or output failed; see diagnostic steps.'
          exit 1

      - name: Mark authorized evidence capture failures as workflow failure
        if: steps.dps_evidence_tests.outcome != 'success' || (vars.PSX_DPS_EVIDENCE_CAPTURE_AUTHORIZED == 'true' && steps.dps_evidence_capture.outcome != 'success')
        run: |
          echo 'ERROR: authorized DPS evidence adapter tests or capture failed.'
          exit 1

      - name: Mark fundamental review failures as workflow failure
        if: steps.fundamentals_tests.outcome != 'success' || steps.fundamentals.outcome != 'success' || steps.fundamentals_artifact.outcome != 'success'
        run: |
          echo 'ERROR: fundamental disclosure review tests or report failed.'
          exit 1

      - name: Mark document integrity failures as workflow failure
        if: steps.document_integrity_tests.outcome != 'success' || steps.document_integrity.outcome != 'success' || steps.document_integrity_artifact.outcome != 'success'
        run: |
          echo 'ERROR: financial document integrity tests or report failed.'
          exit 1

      - name: Mark official-download diagnostics test failure
        if: steps.official_diagnostics_tests.outcome != 'success'
        run: |
          echo 'ERROR: official-download diagnostic tests failed; see earlier logs.'
          exit 1

      - name: Mark official source health summary failures
        if: steps.official_health_tests.outcome != 'success' || steps.official_health_summary.outcome != 'success'
        run: |
          echo 'ERROR: official source summary generation failed.'
          exit 1

      - name: Mark stale market data as workflow failure
        if: steps.freshness.outcome != 'success'
        run: exit 1

  deploy:
    needs: build
    if: needs.build.outputs.can_publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
